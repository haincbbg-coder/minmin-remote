name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Build GUI
        run: cargo build --release --manifest-path crates/mm-viewer-gui/Cargo.toml --target-dir target
      - name: Test
        run: cargo test --release
      - name: Gom vào thư mục tải
        shell: cmd
        run: |
          mkdir dist
          copy target\release\mm-server.exe dist\
          copy target\release\mm-viewer.exe dist\
          copy target\release\mm-viewer-gui.exe dist\
          copy windows\*.bat dist\
      - name: Thu gom bản tải Windows
        uses: actions/upload-artifact@v4
        with:
          name: mm-remote-windows
          path: dist/*
      - name: Phát hành Release (tải trực tiếp)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist\* -DestinationPath mm-remote-windows.zip -Force
          gh release delete latest --cleanup-tag --yes
          gh release create latest mm-remote-windows.zip --title "MinMin Remote - ban moi nhat" --notes "Build tu dong tu commit ${{ github.sha }}"

  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Kiểm tra biên dịch + test phần cross-platform
        run: cargo test --release

  linux-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release cho VPS Ubuntu
        run: cargo build --release -p mm-relay -p mm-server -p mm-viewer
      - name: Thu gom binary Linux
        uses: actions/upload-artifact@v4
        with:
          name: mm-remote-linux
          path: |
            target/release/mm-relay
            target/release/mm-server
            target/release/mm-viewer
            deploy/install-relay.sh
            deploy/README.md
